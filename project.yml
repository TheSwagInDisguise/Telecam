name: Telecam
options:
  bundleIdPrefix: com.telecam
  deploymentTarget:
    iOS: "17.0"
targets:
  Telecam:
    type: application
    platform: iOS
    sources:
      - path: Telecam
    info:
      path: Telecam/Info.plist
      properties:
        CFBundleDisplayName: Telecam
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Telecam needs the camera to take photos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.telecam.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
