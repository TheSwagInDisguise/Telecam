name: Build unsigned IPA

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Telecam.xcodeproj \
            -scheme Telecam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Telecam.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Telecam.app Payload/
          zip -qry Telecam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Telecam-ipa
          path: Telecam.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Telecam build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Telecam.ipa
          body: |
            Unsigned build of ${{ github.sha }} from `${{ github.ref_name }}`.
            Install with Signulous / SideStore / AltStore.
